name: Tests

on:
  pull_request:
    branches:
      - main
      - develop-main
      - develop-feature
      - develop-subscription
    paths-ignore:
      - "docs/**"

  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run test_run command
        shell: bash
        run: |
          make test_run

      - name: Run Lambda unit tests
        shell: bash
        run: |
          make test_lambda

      - name: Run API contract tests
        shell: bash
        run: |
          make contract-test
