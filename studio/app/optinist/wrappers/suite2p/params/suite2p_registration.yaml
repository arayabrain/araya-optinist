torch_device: cpu         # cpu, cuda or mps; falls back to cpu when unavailable

run:
  do_regmetrics: False    # registration quality metrics (PCs); QC only, needs 1500+ frames

registration:
  batch_size: 100         # frames per registration batch (peak memory grows with it)
  nimg_init: 400          # frames used to compute the reference image
  smooth_sigma: 1.15      # gaussian smoothing in XY; ~1 for 2P, 3-5 may work for 1P
  smooth_sigma_time: 0    # gaussian smoothing in time; must stay 0, broken in suite2p 1.1.0
  maxregshift: 0.1        # max allowed registration shift, as a fraction of the frame size
  th_badframes: 1.0       # frames with a lower correlation than this are excluded from detection
  norm_frames: True       # normalize frames when detecting shifts
  subpixel: 10            # precision of the subpixel registration (1/subpixel steps)
  spatial_taper: 3.45     # edge tapering width in pixels; larger for 1P
  do_bidiphase: False     # estimate the bidirectional phase offset
  bidiphase: 0            # bidirectional phase offset in pixels when not estimated
  reg_tif: False          # write the registered binary as tiffs into the suite2p folder
  nonrigid: True          # non-rigid registration
  block_size: [128, 128]  # block size for non-rigid registration
  snr_thresh: 1.2         # block shifts below this SNR are smoothed from their neighbours
  maxregshiftNR: 5        # max shift of a block in pixels relative to the rigid shift
