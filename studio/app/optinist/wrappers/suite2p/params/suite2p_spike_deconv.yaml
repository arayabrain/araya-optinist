# deconvolution settings
extraction:
  neuropil_coefficient: 0.7  # neuropil coefficient
  batch_size: 500            # traces per preprocessing and deconvolution batch

dcnv_preprocess:
  baseline: maximin          # baselining mode: maximin, constant or prctile
  win_baseline: 60.0         # window for maximin, in seconds
  sig_baseline: 10.0         # smoothing constant for gaussian filter, in frames
  prctile_baseline: 8.0      # percentile for the prctile baseline
