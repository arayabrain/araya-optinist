rules:
  input_ab1mmvt2ky:
    input:
    - 1/sample_mouse2p_image.tiff
    return_arg: input_ab1mmvt2ky
    params: {}
    output: 1/tutorial1/input_ab1mmvt2ky/sample_mouse2p_image.pkl
    type: image
    nwbfile:
      session_description: optinist
      identifier: optinist
      experiment_description: None
      device:
        name: Microscope device
        description: Microscope Information
        manufacturer: Microscope Manufacture
      optical_channel:
        name: OpticalChannel
        description: optical channel
        emission_lambda: 500.0
      imaging_plane:
        name: ImagingPlane
        description: standard
        imaging_rate: 30.0
        excitation_lambda: 900.0
        indicator: GCaMP
        location: V1
      image_series:
        starting_time: 0
        starting_frame:
        - 0
        save_raw_image_to_nwb: false
      ophys:
        plane_segmentation:
          name: PlaneSegmentation
          description: ''
    hdf5Path: null
    matPath: null
    path: null
  input_zdax4o54o0:
    input: 1/sample_mouse2p_behavior.csv
    return_arg: input_zdax4o54o0
    params:
      setHeader: null
      setIndex: false
      transpose: false
    output: 1/tutorial1/input_zdax4o54o0/sample_mouse2p_behavior.pkl
    type: behavior
    nwbfile:
      session_description: optinist
      identifier: optinist
      experiment_description: None
      device:
        name: Microscope device
        description: Microscope Information
        manufacturer: Microscope Manufacture
      optical_channel:
        name: OpticalChannel
        description: optical channel
        emission_lambda: 500.0
      imaging_plane:
        name: ImagingPlane
        description: standard
        imaging_rate: 30.0
        excitation_lambda: 900.0
        indicator: GCaMP
        location: V1
      image_series:
        starting_time: 0
        starting_frame:
        - 0
        save_raw_image_to_nwb: false
      ophys:
        plane_segmentation:
          name: PlaneSegmentation
          description: ''
    hdf5Path: null
    matPath: null
    path: null
  suite2p_file_convert_tlri58d268:
    input:
    - 1/tutorial1/input_ab1mmvt2ky/sample_mouse2p_image.pkl
    return_arg:
      input_ab1mmvt2ky: image
    params:
      force_sktiff: false
      batch_size: 500
    output: 1/tutorial1/suite2p_file_convert_tlri58d268/suite2p_file_convert.pkl
    type: suite2p_file_convert
    nwbfile: null
    hdf5Path: null
    matPath: null
    path: suite2p/suite2p_file_convert
  suite2p_registration_xq4pexs8o7:
    input:
    - 1/tutorial1/suite2p_file_convert_tlri58d268/suite2p_file_convert.pkl
    return_arg:
      ops: ops
    params:
      torch_device: cpu
      run:
        do_regmetrics: false
      registration:
        batch_size: 100
        nimg_init: 400
        smooth_sigma: 1.15
        smooth_sigma_time: 0
        maxregshift: 0.1
        th_badframes: 1.0
        norm_frames: true
        subpixel: 10
        spatial_taper: 3.45
        do_bidiphase: false
        bidiphase: 0
        reg_tif: false
        nonrigid: true
        block_size:
        - 128
        - 128
        snr_thresh: 1.2
        maxregshiftNR: 5
    output: 1/tutorial1/suite2p_registration_xq4pexs8o7/suite2p_registration.pkl
    type: suite2p_registration
    nwbfile: null
    hdf5Path: null
    matPath: null
    path: suite2p/suite2p_registration
  suite2p_roi_yvqcdmsg0r:
    input:
    - 1/tutorial1/suite2p_registration_xq4pexs8o7/suite2p_registration.pkl
    return_arg:
      ops: ops
    params:
      tau: 1.0
      diameter:
      - 12
      - 12
      detection:
        algorithm: sparsery
        highpass_time: 100
        nbins: 5000
        denoise: false
        block_size:
        - 64
        - 64
        threshold_scaling: 1.0
        max_overlap: 0.75
        soma_crop: true
        npix_norm_min: 0.0
        npix_norm_max: 100
        sparsery_settings:
          spatial_scale: 0
          highpass_neuropil: 25
          max_ROIs: 5000
          active_percentile: 0.0
        sourcery_settings:
          max_iterations: 20
          connected: true
          smooth_masks: false
      extraction:
        allow_overlap: false
        inner_neuropil_radius: 2
        min_neuropil_pixels: 350
        snr_threshold: 0.0
        batch_size: 500
      classification:
        preclassify: 0.0
        use_builtin_classifier: false
    output: 1/tutorial1/suite2p_roi_yvqcdmsg0r/suite2p_roi.pkl
    type: suite2p_roi
    nwbfile: null
    hdf5Path: null
    matPath: null
    path: suite2p/suite2p_roi
  eta_elysjdrr7j:
    input:
    - 1/tutorial1/suite2p_roi_yvqcdmsg0r/suite2p_roi.pkl
    - 1/tutorial1/suite2p_roi_yvqcdmsg0r/suite2p_roi.pkl
    - 1/tutorial1/input_zdax4o54o0/sample_mouse2p_behavior.pkl
    return_arg:
      fluorescence: neural_data
      iscell: iscell
      input_zdax4o54o0: behaviors_data
    params:
      I/O:
        transpose_x: true
        transpose_y: false
        event_col_index: 1
      ETA:
        trigger_type: up
        trigger_threshold: 0.5
        pre_event: -10
        post_event: 10
    output: 1/tutorial1/eta_elysjdrr7j/eta.pkl
    type: eta
    nwbfile: null
    hdf5Path: null
    matPath: null
    path: optinist/basic_neural_analysis/eta
last_output:
- 1/tutorial1/eta_elysjdrr7j/eta.pkl
